# MkDocs site — sources live on `main`. CI merges the built HTML into the
# `website` branch under `documentation/` (see .github/workflows).

site_name: OopsieVerse
site_description: Damage-aware, simulator-agnostic benchmarking for safer policies
site_url: !ENV [OOPSIE_DOCS_SITE_URL, http://127.0.0.1:8000/]

repo_url: https://github.com/UT-Austin-RobIn/oopsieverse
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - DamageSim: damagesim.md
  - OopsieBench: oopsiebench.md
  - Troubleshooting: troubleshooting.md
