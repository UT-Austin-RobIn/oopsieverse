# Data / task
data_path: demos/behavior1k/playback_data/shelve_item.hdf5
task_name: shelve_item
objects_of_interest:
  - box_of_crackers
  - book
  - bottle_of_wine
  - bottle_of_beer
  - stand
# null → PlaybackDataset defaults (eef + 2 external segs + proprio)
obs_keys: null

frame_stack: 2
action_chunk: 8
seg_img_size: 128
normalize_action: true

# Training
num_steps: 30000
batch_size: 64
lr: 0.0003
weight_decay: 0.00001
grad_clip: 5.0

# Logging / IO
log_every: 10
save_every: 5000
eval_every: 500
save_dir: checkpoints/shelve_item
use_wandb: false
wandb_project: oopsieverse
wandb_entity: null
wandb_run_name: shelve-item
device: cuda
resume: null
