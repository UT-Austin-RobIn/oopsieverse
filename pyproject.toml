# pyproject.toml

[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oopsieverse"
version = "0.1.0"
description = "OopsieVerse research project for simulation and benchmarking"
authors = []
readme = "README.md"
requires-python = ">=3.10"
keywords = ["robotics", "simulation", "benchmarking"]
license = { text = "MIT" }

dependencies = [
    "open3d",
    "matplotlib",
    "scipy",
    "tyro",
    "tqdm",           # useful for progress bars in install.py
    "numba==0.62.1",
    "openai>=1.40",   # LLM params: one client for every provider (damagesim/llm_params/models.py)
    "pydantic>=2",
    # add more Python-only dependencies here
]

[tool.setuptools.packages.find]
where = ["."]

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-glightbox>=0.5.2",
]
